<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://oymozbalhgzhqletveuq.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Stock</title>


<link rel="stylesheet" href="/stock/assets/stock-pages.css">
</head>
<body>
<header class="top"><div class="wrap row"><span class="brand"><span class="logo" aria-hidden="true"></span>Stock by AllInCenter</span></div></header>

<main class="wrap">
<nav class="langs" aria-label="Language"><button type="button" data-lang="he" lang="he">עברית</button><button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="ar" lang="ar">العربية</button></nav>
<h1>Stock</h1>
<p id="message" role="status" aria-live="polite"></p>
<p id="hint" class="muted"></p>
<button type="button" id="go" class="btn btn-primary" hidden></button>
<form id="form" hidden autocomplete="on" novalidate>
  <input type="email" name="username" autocomplete="username" hidden>
  <label for="pw" id="pw-label"></label><input id="pw" type="password" autocomplete="new-password" minlength="8" required>
  <label for="pw2" id="pw2-label"></label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
  <button type="submit" id="save" class="btn btn-primary"></button>
</form>
<div id="actions" class="actions"></div>
<noscript>JavaScript is required to complete this step.</noscript>
</main>
<script type="module" src="/stock/assets/auth-start.mjs"></script>
</body>
</html>
